<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PhoneSpeaker — Receiver</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #2a2a3d;
    --accent: #00f5a0;
    --accent2: #00b8ff;
    --danger: #ff3c6e;
    --text: #e8e8f0;
    --muted: #6b6b8a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,184,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,184,255,0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    top: -30%; left: -30%;
    width: 160%; height: 160%;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,184,255,0.07) 0%, transparent 65%);
    pointer-events: none;
    animation: breathe 6s ease-in-out infinite alternate;
  }

  @keyframes breathe {
    from { transform: scale(1); opacity: 0.5; }
    to   { transform: scale(1.05); opacity: 1; }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .badge {
    display: inline-block;
    background: rgba(0,184,255,0.1);
    border: 1px solid rgba(0,184,255,0.3);
    color: var(--accent2);
    font-size: 0.6rem;
    letter-spacing: 2px;
    padding: 0.2rem 0.7rem;
    border-radius: 2px;
    margin-top: 0.5rem;
    text-transform: uppercase;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent2), transparent);
    opacity: 0.5;
  }

  .card-label {
    font-size: 0.6rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .btn-primary {
    width: 100%;
    padding: 1rem 1.2rem;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #000;
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary:not(:disabled):hover { opacity: 0.85; }

  .btn-block {
    width: 100%;
    padding: 1rem;
    border: 1px solid var(--danger);
    border-radius: 6px;
    background: transparent;
    color: var(--danger);
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-test {
    width: 100%;
    margin-top: 1rem;
    padding: 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1px;
    cursor: pointer;
  }

  .btn-block:hover { background: rgba(255,60,110,0.1); }

  /* Speaker visual */
  .speaker-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem 0;
  }

  .speaker-ring {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2px solid rgba(0,184,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 1rem;
  }

  .speaker-ring::before, .speaker-ring::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0,184,255,0.15);
    animation: ripple 2s ease-out infinite;
  }

  .speaker-ring::before { inset: -12px; animation-delay: 0s; }
  .speaker-ring::after  { inset: -24px; animation-delay: 0.5s; }

  @keyframes ripple {
    0%   { opacity: 0.6; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.1); }
  }

  .speaker-icon {
    font-size: 2.5rem;
    animation: none;
  }

  .speaker-icon.playing {
    animation: speakerPulse 0.8s ease-in-out infinite alternate;
  }

  @keyframes speakerPulse {
    from { transform: scale(0.95); }
    to   { transform: scale(1.05); }
  }

  /* Waveform */
  .wave-row {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 36px;
    margin: 0.5rem 0;
  }

  .wave-bar {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(to top, var(--accent2), var(--accent));
    min-height: 3px;
    transition: height 0.08s;
  }

  /* Volume */
  .vol-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-top: 0.5rem;
  }

  .vol-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; min-width: 20px; }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    cursor: pointer;
    border: 2px solid var(--bg);
  }

  .status {
    font-size: 0.7rem;
    letter-spacing: 1px;
    text-align: center;
    color: var(--muted);
    min-height: 1.2em;
  }
  .status.ok  { color: var(--accent); }
  .status.err { color: var(--danger); }

  /* sections */
  #join-section   { display: block; }
  #active-section { display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">PhoneSpeaker</div>
    <div class="badge">📱 Receiver</div>
  </header>

  <!-- JOIN -->
  <div id="join-section">
    <div class="card">
      <div class="card-label">Laptop Audio</div>
      <button class="btn-primary" id="join-btn" onclick="join()">Connect</button>
    </div>
    <p class="status" id="join-status"></p>
  </div>

  <!-- ACTIVE -->
  <div id="active-section">
    <div class="card">
      <div class="speaker-wrap">
        <div class="speaker-ring">
          <span class="speaker-icon" id="speaker-icon">🔊</span>
        </div>
        <div class="wave-row" id="wave"></div>
        <p class="status ok" id="playing-status">Connected — waiting for sender...</p>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Volume</div>
      <div class="vol-row">
        <span class="vol-label">🔈</span>
        <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
        <span class="vol-label">🔊</span>
      </div>
      <button class="btn-test" onclick="testSpeaker()">🔔 Test speaker</button>
    </div>

    <button class="btn-block" onclick="disconnect()">⏹ Disconnect</button>
  </div>
</div>

<!-- Muted: playback goes through Web Audio. Chrome still needs the remote stream attached to an element. -->
<audio id="audio-el" autoplay playsinline muted></audio>

<script>
let ws, pc, gainNode, audioCtx2, analyser2, animId2, streamSrc;
const audioEl = document.getElementById('audio-el');

const WS_URL = `ws://${location.host}`;
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

// Must run inside the Connect tap — mobile browsers only allow audio started by a user gesture
function unlockAudio() {
  if (navigator.audioSession) navigator.audioSession.type = 'playback'; // iOS: ignore the silent switch
  audioCtx2 = new AudioContext();
  gainNode = audioCtx2.createGain();
  gainNode.gain.value = document.getElementById('vol-slider').value;
  gainNode.connect(audioCtx2.destination);
  analyser2 = audioCtx2.createAnalyser();
  analyser2.fftSize = 32;
  audioCtx2.resume();
}

async function join() {
  unlockAudio();
  document.getElementById('join-btn').disabled = true;
  setJoinStatus('Connecting...', '');

  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'join' }));
  };

  ws.onmessage = async ({ data }) => {
    const msg = JSON.parse(data);

    if (msg.type === 'joined') {
      showActiveSection();
      setPlayingStatus(msg.live ? 'Connecting to sender...' : 'Waiting for sender...', 'ok');
    }

    if (msg.type === 'offer') {
      await handleOffer(msg.sdp);
    }

    if (msg.type === 'ice-candidate') {
      if (pc && msg.candidate) {
        try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch {}
      }
    }

    if (msg.type === 'sender-disconnected') {
      if (pc) { pc.close(); pc = null; }
      setPlayingStatus('Sender disconnected — waiting for it to return...', 'err');
      document.getElementById('speaker-icon').className = 'speaker-icon';
    }
  };

  ws.onclose = () => {
    if (document.getElementById('active-section').style.display !== 'none') {
      setPlayingStatus('Connection lost.', 'err');
    }
  };
  ws.onerror = () => {
    setJoinStatus('Could not reach the server.', 'err');
    document.getElementById('join-btn').disabled = false;
  };
}

async function handleOffer(sdp) {
  // Sender restarted — replace the old connection
  if (pc) pc.close();
  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  pc.ontrack = ({ streams }) => {
    audioEl.srcObject = streams[0];
    audioEl.play().catch(() => {});
    setPlayingStatus('Connecting audio...', 'ok');
    playStream(streams[0]);
  };

  pc.onicecandidate = ({ candidate }) => {
    if (candidate) {
      ws.send(JSON.stringify({ type: 'ice-candidate', candidate }));
    }
  };

  pc.oniceconnectionstatechange = () => {
    const state = pc.iceConnectionState;
    if (state === 'connected' || state === 'completed') {
      document.getElementById('speaker-icon').classList.add('playing');
      setPlayingStatus('Connected — listening...', 'ok');
    } else if (state === 'failed' || state === 'disconnected') {
      document.getElementById('speaker-icon').className = 'speaker-icon';
      setPlayingStatus('Could not reach the laptop over the network (' + state + ')', 'err');
    }
  };

  await pc.setRemoteDescription(new RTCSessionDescription(sdp));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  ws.send(JSON.stringify({ type: 'answer', sdp: pc.localDescription }));
}

function showActiveSection() {
  document.getElementById('join-section').style.display = 'none';
  document.getElementById('active-section').style.display = 'block';
}

function setJoinStatus(msg, cls) {
  const el = document.getElementById('join-status');
  el.textContent = msg;
  el.className = 'status ' + cls;
}

function setPlayingStatus(msg, cls) {
  const el = document.getElementById('playing-status');
  el.textContent = msg;
  el.className = 'status ' + cls;
}

function setVolume(v) {
  if (gainNode) gainNode.gain.value = v;
}

// Short beep through the same output path as the stream
function testSpeaker() {
  audioCtx2.resume();
  const osc = audioCtx2.createOscillator();
  osc.frequency.value = 880;
  osc.connect(gainNode);
  osc.start();
  osc.stop(audioCtx2.currentTime + 0.4);
}

function playStream(stream) {
  if (streamSrc) streamSrc.disconnect();
  streamSrc = audioCtx2.createMediaStreamSource(stream);
  streamSrc.connect(gainNode);
  streamSrc.connect(analyser2);
  if (audioCtx2.state !== 'running') {
    setPlayingStatus('Tap anywhere to enable sound', 'err');
    document.addEventListener('click', () => {
      audioCtx2.resume();
      setPlayingStatus('Connected — listening...', 'ok');
    }, { once: true });
  }
  setupReceiverVisualiser();
}

function setupReceiverVisualiser() {
  if (animId2) return; // already drawing from analyser2
  try {
    const waveEl = document.getElementById('wave');
    waveEl.innerHTML = '';
    const bars = Array.from({ length: 14 }, () => {
      const b = document.createElement('div');
      b.className = 'wave-bar';
      b.style.height = '3px';
      waveEl.appendChild(b);
      return b;
    });

    const data = new Uint8Array(analyser2.frequencyBinCount);
    function draw() {
      animId2 = requestAnimationFrame(draw);
      analyser2.getByteFrequencyData(data);
      bars.forEach((b, i) => {
        const v = (data[i] || 0) / 255;
        b.style.height = (3 + v * 33) + 'px';
        b.style.opacity = 0.3 + v * 0.7;
      });
    }
    draw();
  } catch (e) {
    // visualiser optional
  }
}

function disconnect() {
  if (animId2) cancelAnimationFrame(animId2);
  if (audioCtx2) audioCtx2.close();
  if (pc) pc.close();
  if (ws) ws.close();
  location.reload();
}
</script>
</body>
</html>
