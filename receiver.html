<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PhoneSpeaker — Receiver</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #2a2a3d;
    --accent: #00f5a0;
    --accent2: #00b8ff;
    --danger: #ff3c6e;
    --text: #e8e8f0;
    --muted: #6b6b8a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,184,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,184,255,0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    top: -30%; left: -30%;
    width: 160%; height: 160%;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,184,255,0.07) 0%, transparent 65%);
    pointer-events: none;
    animation: breathe 6s ease-in-out infinite alternate;
  }

  @keyframes breathe {
    from { transform: scale(1); opacity: 0.5; }
    to   { transform: scale(1.05); opacity: 1; }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .badge {
    display: inline-block;
    background: rgba(0,184,255,0.1);
    border: 1px solid rgba(0,184,255,0.3);
    color: var(--accent2);
    font-size: 0.6rem;
    letter-spacing: 2px;
    padding: 0.2rem 0.7rem;
    border-radius: 2px;
    margin-top: 0.5rem;
    text-transform: uppercase;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent2), transparent);
    opacity: 0.5;
  }

  .card-label {
    font-size: 0.6rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .btn-primary {
    width: 100%;
    padding: 1rem 1.2rem;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #000;
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary:not(:disabled):hover { opacity: 0.85; }

  .btn-block {
    width: 100%;
    padding: 1rem;
    border: 1px solid var(--danger);
    border-radius: 6px;
    background: transparent;
    color: var(--danger);
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-test {
    width: 100%;
    margin-top: 1rem;
    padding: 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 1px;
    cursor: pointer;
  }

  .btn-block:hover { background: rgba(255,60,110,0.1); }

  /* Speaker visual */
  .speaker-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem 0;
  }

  .speaker-ring {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2px solid rgba(0,184,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 1rem;
  }

  .speaker-ring::before, .speaker-ring::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(0,184,255,0.15);
    animation: ripple 2s ease-out infinite;
  }

  .speaker-ring::before { inset: -12px; animation-delay: 0s; }
  .speaker-ring::after  { inset: -24px; animation-delay: 0.5s; }

  @keyframes ripple {
    0%   { opacity: 0.6; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.1); }
  }

  .speaker-icon {
    font-size: 2.5rem;
    animation: none;
  }

  .speaker-icon.playing {
    animation: speakerPulse 0.8s ease-in-out infinite alternate;
  }

  @keyframes speakerPulse {
    from { transform: scale(0.95); }
    to   { transform: scale(1.05); }
  }

  /* Waveform */
  .wave-row {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 36px;
    margin: 0.5rem 0;
  }

  .wave-bar {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(to top, var(--accent2), var(--accent));
    min-height: 3px;
    transition: height 0.08s;
  }

  /* Volume */
  .vol-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-top: 0.5rem;
  }

  .vol-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; min-width: 20px; }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    cursor: pointer;
    border: 2px solid var(--bg);
  }

  .status {
    font-size: 0.7rem;
    letter-spacing: 1px;
    text-align: center;
    color: var(--muted);
    min-height: 1.2em;
  }
  .status.ok  { color: var(--accent); }
  .status.err { color: var(--danger); }

  .hint {
    font-size: 0.6rem;
    letter-spacing: 1px;
    text-align: center;
    color: var(--muted);
    margin-top: 0.6rem;
  }

  .stats {
    font-size: 0.55rem;
    letter-spacing: 0.5px;
    text-align: center;
    color: var(--muted);
    opacity: 0.7;
    margin-top: 0.4rem;
    min-height: 1em;
  }

  /* Buffer selector */
  .seg {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.4rem;
  }

  .seg button {
    padding: 0.55rem 0.2rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    cursor: pointer;
  }

  .seg button.active {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(0,184,255,0.08);
  }

  /* sections */
  #join-section   { display: block; }
  #active-section { display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">PhoneSpeaker</div>
    <div class="badge">📱 Receiver</div>
  </header>

  <!-- JOIN -->
  <div id="join-section">
    <div class="card">
      <div class="card-label">Laptop Audio</div>
      <button class="btn-primary" id="join-btn" onclick="join()">Connect</button>
    </div>
    <p class="status" id="join-status"></p>
  </div>

  <!-- ACTIVE -->
  <div id="active-section">
    <div class="card">
      <div class="speaker-wrap">
        <div class="speaker-ring">
          <span class="speaker-icon" id="speaker-icon">🔊</span>
        </div>
        <div class="wave-row" id="wave"></div>
        <p class="status ok" id="playing-status">Waiting for sender...</p>
        <p class="stats" id="stats"></p>
        <p class="hint">Keep this tab open — you can lock the screen or switch apps.</p>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Volume</div>
      <div class="vol-row" id="vol-row">
        <span class="vol-label">🔈</span>
        <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
        <span class="vol-label">🔊</span>
      </div>
      <p class="hint" id="vol-hint" style="display:none">Use your phone's volume buttons.</p>
      <button class="btn-test" onclick="testSpeaker()">🔔 Test speaker</button>
    </div>

    <div class="card">
      <div class="card-label">Buffer</div>
      <div class="seg" id="buffer-seg">
        <button data-mode="low" onclick="setBuffer('low')">Low delay</button>
        <button data-mode="balanced" onclick="setBuffer('balanced')">Balanced</button>
        <button data-mode="smooth" onclick="setBuffer('smooth')">Smooth</button>
      </div>
      <p class="hint">More buffer = fewer dropouts, but more delay.</p>
    </div>

    <button class="btn-block" onclick="disconnect()">⏹ Disconnect</button>
  </div>
</div>

<!-- Plays the stream. A real, unmuted media element is what lets iOS and Android keep playing in the background. -->
<audio id="stream-audio" playsinline></audio>
<!-- Near-silent loop: keeps the page alive (and the lock-screen controls up) while the stream reconnects -->
<audio id="keepalive-audio" playsinline loop></audio>

<script src="/signal.js"></script>
<script>
let signal, pc, pcId, audioCtx, analyser, streamSrc, animId, prevStats;
let joined = false, signalUp = false, senderLive = false;
let userPaused = false, needsTap = false, brokenTicks = 0;
const streamEl = document.getElementById('stream-audio');
const keepAliveEl = document.getElementById('keepalive-audio');

const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];
// Minimum jitter buffer. Phones batch Wi-Fi packets (power save, worse with the screen off),
// so a little headroom turns those bursts into smooth audio instead of dropouts.
const BUFFER_MS = { low: null, balanced: 150, smooth: 400 };
const savedBuffer = localStorage.getItem('bufferMode');
let bufferMode = savedBuffer in BUFFER_MS ? savedBuffer : 'balanced';
// iOS ignores element volume (hardware buttons only); it also suspends Web Audio in the background
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const volumeControllable = (() => { const a = new Audio(); a.volume = 0.5; return a.volume === 0.5; })();

const randomId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
// Survives reloads of this tab, so the sender recognises the phone when it reconnects
const clientId = sessionStorage.getItem('clientId') || randomId();
sessionStorage.setItem('clientId', clientId);

if (!volumeControllable) {
  document.getElementById('vol-row').style.display = 'none';
  document.getElementById('vol-hint').style.display = 'block';
}
renderBuffer();

// Must run inside the Connect tap — mobile browsers only allow audio started by a user gesture.
// Starting both elements here unlocks them for later programmatic play().
function unlockAudio() {
  if (navigator.audioSession) navigator.audioSession.type = 'playback'; // iOS: ignore the silent switch, keep playing when locked
  const silence = URL.createObjectURL(silentWav(10));
  keepAliveEl.src = silence;
  keepAliveEl.play().catch(() => {});
  streamEl.src = silence;
  streamEl.play().catch(() => {});
  audioCtx = new AudioContext();
  audioCtx.resume();
  setupMediaSession();
}

function join() {
  unlockAudio();
  document.getElementById('join-btn').disabled = true;
  setJoinStatus('Connecting...', '');

  signal = connectSignal({
    onOpen: () => signal.send({ type: 'join', clientId, pcId: livePcId() }),
    onMessage: handleMessage,
    onDown: () => {
      signalUp = false;
      if (joined) render();
      else setJoinStatus('Could not reach the server — retrying...', 'err');
    },
  });
  setInterval(watchdog, 5000);
  setInterval(pollStats, 2000);
}

// Only claim a connection the sender can keep; otherwise ask for a fresh one
const livePcId = () => (pc?.connectionState === 'connected' ? pcId : null);

async function handleMessage(msg) {
  switch (msg.type) {
    case 'joined':
      joined = signalUp = true;
      senderLive = msg.live;
      showActiveSection();
      break;
    case 'offer':
      await handleOffer(msg);
      break;
    case 'ice-candidate':
      if (pc && msg.pcId === pcId && msg.candidate) await pc.addIceCandidate(msg.candidate).catch(() => {});
      break;
    case 'sender-live':
      senderLive = true;
      break;
    case 'sender-disconnected':
      // Only the sender's server link dropped — the audio connection may well be fine
      senderLive = false;
      break;
    case 'sender-stopped':
      senderLive = false;
      closePc();
      break;
  }
  render();
}

async function handleOffer({ pcId: id, sdp }) {
  // Same id = ICE restart on the existing connection; new id = sender started over
  if (!pc || id !== pcId) createPc(id);
  await pc.setRemoteDescription(sdp);
  await pc.setLocalDescription(await pc.createAnswer());
  signal.send({ type: 'answer', pcId: id, sdp: pc.localDescription });
}

function createPc(id) {
  closePc();
  const conn = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  pc = conn;
  pcId = id;
  prevStats = null;

  conn.ontrack = ({ track, streams, receiver }) => {
    applyBuffer(receiver);
    attachStream(streams[0] || new MediaStream([track]));
  };
  conn.onicecandidate = ({ candidate }) => {
    if (candidate && conn === pc) signal.send({ type: 'ice-candidate', pcId: id, candidate });
  };
  conn.onconnectionstatechange = render;
}

function closePc() {
  if (!pc) return;
  pc.onconnectionstatechange = null;
  pc.close();
  pc = pcId = null;
}

// The sender normally notices a broken connection first; this covers the case where it didn't
function watchdog() {
  const broken = pc && ['disconnected', 'failed'].includes(pc.connectionState);
  brokenTicks = broken && signalUp ? brokenTicks + 1 : 0;
  if (brokenTicks >= 3) {
    brokenTicks = 0;
    signal.send({ type: 'join', clientId, pcId: null });
  }
}

function attachStream(stream) {
  streamEl.srcObject = stream;
  playStream();
  connectAnalyser(stream);
}

function playStream() {
  if (userPaused || !streamEl.srcObject) return;
  streamEl.play().then(
    () => { needsTap = false; render(); },
    (e) => { if (e.name === 'NotAllowedError') { needsTap = true; render(); } },
  );
}

document.addEventListener('click', () => {
  if (!needsTap) return;
  keepAliveEl.play().catch(() => {});
  playStream();
});

// Lock-screen / notification controls
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Laptop audio', artist: 'PhoneSpeaker' });
  } catch {}
  const handlers = { play: resume, pause };
  Object.entries(handlers).forEach(([action, handler]) => {
    try { navigator.mediaSession.setActionHandler(action, handler); } catch {}
  });
}

function pause() {
  userPaused = true;
  streamEl.pause();
  keepAliveEl.pause();
  render();
}

function resume() {
  userPaused = false;
  keepAliveEl.play().catch(() => {});
  playStream();
  render();
}

document.addEventListener('visibilitychange', () => {
  if (!audioCtx) return;
  if (document.hidden) {
    audioCtx.suspend(); // only drives the visualiser and test beep
    return;
  }
  audioCtx.resume();
  if (!userPaused) {
    keepAliveEl.play().catch(() => {});
    if (streamEl.paused) playStream();
  }
  render();
});

function render() {
  const state = pc?.connectionState;
  const live = state === 'connected';
  document.getElementById('speaker-icon').classList.toggle('playing', live && !userPaused);
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = userPaused ? 'paused' : 'playing';
  if (!live) document.getElementById('stats').textContent = '';

  if (needsTap) return setPlayingStatus('Tap anywhere to enable sound', 'err');
  if (userPaused) return setPlayingStatus('Paused', '');
  if (live) return setPlayingStatus(signalUp ? 'Connected — listening...' : 'Listening — reconnecting to server...', 'ok');
  if (state === 'disconnected' || state === 'failed') return setPlayingStatus('Connection interrupted — reconnecting...', 'err');
  if (!signalUp) return setPlayingStatus('Reconnecting to server...', 'err');
  if (pc || senderLive) return setPlayingStatus('Connecting to laptop...', 'ok');
  setPlayingStatus('Waiting for sender...', '');
}

function setBuffer(mode) {
  bufferMode = mode;
  localStorage.setItem('bufferMode', mode);
  renderBuffer();
  pc?.getReceivers().forEach(applyBuffer);
}

function renderBuffer() {
  document.querySelectorAll('#buffer-seg button').forEach((b) => b.classList.toggle('active', b.dataset.mode === bufferMode));
}

function applyBuffer(receiver) {
  const ms = BUFFER_MS[bufferMode];
  try {
    if ('jitterBufferTarget' in receiver) receiver.jitterBufferTarget = ms;
    else if ('playoutDelayHint' in receiver) receiver.playoutDelayHint = ms === null ? null : ms / 1000;
  } catch {}
}

// Link quality readout, so a dropout can be told apart from network loss
async function pollStats() {
  if (document.hidden || pc?.connectionState !== 'connected') return;
  const conn = pc;
  const report = await conn.getStats();
  let inbound, pairId, pair;
  report.forEach((s) => {
    if (s.type === 'inbound-rtp' && s.kind === 'audio') inbound = s;
    if (s.type === 'transport' && s.selectedCandidatePairId) pairId = s.selectedCandidatePairId;
  });
  report.forEach((s) => {
    if (s.type === 'candidate-pair' && (pairId ? s.id === pairId : s.nominated && s.state === 'succeeded')) pair = s;
  });
  if (!inbound || conn !== pc) return;

  const prev = prevStats;
  prevStats = inbound;
  if (!prev) return;
  const delta = (key) => (inbound[key] ?? 0) - (prev[key] ?? 0);
  const parts = [];
  if (pair?.currentRoundTripTime != null) parts.push(`${Math.round(pair.currentRoundTripTime * 1000)} ms ping`);
  const received = delta('packetsReceived'), lost = delta('packetsLost');
  if (received + lost > 0) parts.push(`${(100 * Math.max(lost, 0) / (received + lost)).toFixed(1)}% loss`);
  if (delta('jitterBufferEmittedCount') > 0) parts.push(`${Math.round(1000 * delta('jitterBufferDelay') / delta('jitterBufferEmittedCount'))} ms buffer`);
  if (delta('totalSamplesReceived') > 0) parts.push(`${(100 * delta('concealedSamples') / delta('totalSamplesReceived')).toFixed(1)}% dropouts`);
  document.getElementById('stats').textContent = parts.join(' · ');
}

function showActiveSection() {
  document.getElementById('join-section').style.display = 'none';
  document.getElementById('active-section').style.display = 'block';
}

function setJoinStatus(msg, cls) {
  const el = document.getElementById('join-status');
  el.textContent = msg;
  el.className = 'status ' + cls;
}

function setPlayingStatus(msg, cls) {
  const el = document.getElementById('playing-status');
  el.textContent = msg;
  el.className = 'status ' + cls;
}

function setVolume(v) {
  streamEl.volume = v;
}

function testSpeaker() {
  audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  gain.gain.value = document.getElementById('vol-slider').value;
  osc.frequency.value = 880;
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);
}

// Visualiser only — never connected to the speakers. Skipped on iOS, where tapping a
// remote stream into Web Audio is the riskiest part of the pipeline and adds nothing audible.
function connectAnalyser(stream) {
  if (isIOS) return;
  try {
    if (!analyser) {
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 32;
    }
    if (streamSrc) streamSrc.disconnect();
    streamSrc = audioCtx.createMediaStreamSource(stream);
    streamSrc.connect(analyser);
    setupReceiverVisualiser();
  } catch {
    // visualiser optional
  }
}

function setupReceiverVisualiser() {
  if (animId) return; // already drawing from analyser
  const waveEl = document.getElementById('wave');
  waveEl.innerHTML = '';
  const bars = Array.from({ length: 14 }, () => {
    const b = document.createElement('div');
    b.className = 'wave-bar';
    b.style.height = '3px';
    waveEl.appendChild(b);
    return b;
  });

  const data = new Uint8Array(analyser.frequencyBinCount);
  function draw() {
    animId = requestAnimationFrame(draw);
    analyser.getByteFrequencyData(data);
    bars.forEach((b, i) => {
      const v = (data[i] || 0) / 255;
      b.style.height = (3 + v * 33) + 'px';
      b.style.opacity = 0.3 + v * 0.7;
    });
  }
  draw();
}

// 16-bit mono WAV at ±1 LSB (about -90 dB): inaudible, but not digital silence that a
// platform might treat as "not really playing". 10 s is long enough to count as real media.
function silentWav(seconds) {
  const rate = 8000, samples = rate * seconds;
  const view = new DataView(new ArrayBuffer(44 + samples * 2));
  const text = (offset, s) => [...s].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
  text(0, 'RIFF'); view.setUint32(4, 36 + samples * 2, true); text(8, 'WAVE');
  text(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  text(36, 'data'); view.setUint32(40, samples * 2, true);
  for (let i = 0; i < samples; i++) view.setInt16(44 + i * 2, i & 1 ? 1 : -1, true);
  return new Blob([view], { type: 'audio/wav' });
}

function disconnect() {
  if (animId) cancelAnimationFrame(animId);
  if (audioCtx) audioCtx.close();
  closePc();
  signal?.close();
  location.reload();
}
</script>
</body>
</html>
