<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhoneSpeaker — Sender</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0a0a0f;
        --surface: #13131a;
        --border: #2a2a3d;
        --accent: #00f5a0;
        --accent2: #00b8ff;
        --danger: #ff3c6e;
        --text: #e8e8f0;
        --muted: #6b6b8a;
        --glow: 0 0 30px rgba(0, 245, 160, 0.25);
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Space Mono", monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        overflow-x: hidden;
      }

      /* animated grid bg */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(0, 245, 160, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 245, 160, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }

      body::after {
        content: "";
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background:
          radial-gradient(
            ellipse at 60% 40%,
            rgba(0, 184, 255, 0.06) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 30% 70%,
            rgba(0, 245, 160, 0.06) 0%,
            transparent 50%
          );
        pointer-events: none;
        z-index: 0;
        animation: drift 20s ease-in-out infinite alternate;
      }

      @keyframes drift {
        from {
          transform: translate(0, 0) rotate(0deg);
        }
        to {
          transform: translate(2%, 2%) rotate(2deg);
        }
      }

      .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 520px;
      }

      header {
        text-align: center;
        margin-bottom: 2.5rem;
      }

      .logo {
        font-family: "Syne", sans-serif;
        font-size: 2.2rem;
        font-weight: 800;
        letter-spacing: -1px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .tagline {
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-top: 0.4rem;
      }

      .badge {
        display: inline-block;
        background: rgba(0, 245, 160, 0.1);
        border: 1px solid rgba(0, 245, 160, 0.3);
        color: var(--accent);
        font-size: 0.65rem;
        letter-spacing: 2px;
        padding: 0.2rem 0.7rem;
        border-radius: 2px;
        margin-top: 0.8rem;
        text-transform: uppercase;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 2rem;
        margin-bottom: 1rem;
        position: relative;
        overflow: hidden;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        opacity: 0.5;
      }

      .card-label {
        font-size: 0.65rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 1.2rem;
      }

      /* Source selector */
      .source-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .source-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-family: "Space Mono", monospace;
        font-size: 0.75rem;
        padding: 0.8rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
        letter-spacing: 1px;
      }

      .source-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .source-btn.active {
        border-color: var(--accent);
        background: rgba(0, 245, 160, 0.08);
        color: var(--accent);
        box-shadow: var(--glow);
      }

      .source-btn .icon {
        font-size: 1.4rem;
        display: block;
        margin-bottom: 0.3rem;
      }

      /* Main action button */
      .btn-primary {
        width: 100%;
        padding: 1rem;
        border: none;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #000;
        font-family: "Syne", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
      }

      .btn-primary::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0);
        transition: background 0.2s;
      }

      .btn-primary:hover::after {
        background: rgba(255, 255, 255, 0.1);
      }
      .btn-primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-danger {
        width: 100%;
        padding: 0.9rem;
        border: 1px solid var(--danger);
        border-radius: 6px;
        background: transparent;
        color: var(--danger);
        font-family: "Space Mono", monospace;
        font-size: 0.8rem;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-danger:hover {
        background: rgba(255, 60, 110, 0.1);
      }

      /* Receiver link display */
      .room-display {
        text-align: center;
        padding: 1.5rem;
      }

      .receiver-url {
        font-size: 0.85rem;
        color: var(--accent);
        word-break: break-all;
      }

      .room-hint {
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-top: 0.5rem;
      }

      #qrcode {
        margin: 1.2rem auto 0;
        width: fit-content;
        padding: 0.8rem;
        background: white;
        border-radius: 6px;
        display: none;
      }

      #qrcode img,
      #qrcode canvas {
        display: block;
      }

      /* Visualiser */
      .viz-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        height: 40px;
        margin: 1rem 0 0.5rem;
      }

      .viz-bar {
        width: 3px;
        border-radius: 2px;
        background: linear-gradient(to top, var(--accent2), var(--accent));
        transition: height 0.05s;
        min-height: 3px;
      }

      /* Receivers list */
      .receivers-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-height: 150px;
        overflow-y: auto;
      }

      .receiver-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem 0.7rem;
        background: rgba(0, 245, 160, 0.05);
        border: 1px solid rgba(0, 245, 160, 0.15);
        border-radius: 4px;
        font-size: 0.7rem;
        color: var(--accent);
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .receiver-item.pending {
        color: var(--muted);
        border-color: var(--border);
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .status-line {
        font-size: 0.7rem;
        color: var(--muted);
        text-align: center;
        letter-spacing: 1px;
        min-height: 1.2em;
      }

      .status-line.ok {
        color: var(--accent);
      }
      .status-line.err {
        color: var(--danger);
      }

      /* Sections visibility */
      #setup-section {
        display: block;
      }
      #active-section {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">PhoneSpeaker</div>
        <div class="tagline">Laptop → Mobile Audio</div>
        <div class="badge">⬛ Sender</div>
      </header>

      <!-- SETUP -->
      <div id="setup-section">
        <div class="card">
          <div class="card-label">01 — Audio Source</div>
          <div class="source-grid">
            <button
              class="source-btn active"
              id="btn-system"
              onclick="selectSource('system')"
            >
              <span class="icon">🖥️</span>System Audio
            </button>
            <button
              class="source-btn"
              id="btn-mic"
              onclick="selectSource('mic')"
            >
              <span class="icon">🎙️</span>Microphone
            </button>
          </div>
          <p class="status-line" id="source-hint">
            System audio captures everything playing on your laptop.
          </p>
        </div>

        <div class="card">
          <div class="card-label">02 — Start Streaming</div>
          <button class="btn-primary" id="start-btn" onclick="startSession()">
            Go Live
          </button>
        </div>
      </div>

      <!-- ACTIVE -->
      <div id="active-section">
        <div class="card">
          <div class="card-label">Open on your phone</div>
          <div class="room-display">
            <div class="receiver-url" id="receiver-url"></div>
            <div class="room-hint">Or scan the QR code</div>
            <div id="qrcode"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-label">Audio Level</div>
          <div class="viz-row" id="viz"></div>
          <p class="status-line ok" id="stream-status">Streaming...</p>
        </div>

        <div class="card">
          <div class="card-label">
            Connected Devices (<span id="rx-count">0</span>)
          </div>
          <div class="receivers-list" id="receivers-list">
            <p class="status-line">Waiting for phones to connect...</p>
          </div>
        </div>

        <button class="btn-danger" onclick="stopSession()">
          ⏹ Stop &amp; Disconnect All
        </button>
      </div>
    </div>

    <script src="/signal.js"></script>
    <script>
      let signal, localStream, audioCtx, analyser, animId;
      let selectedSource = "system";
      let deviceCount = 0;
      const peers = new Map(); // receiverId -> { pc, pcId, present, restarts, createdAt, timer }
      const deviceEls = new Map(); // receiverId -> list item

      const ICE_SERVERS = [{ urls: "stun:stun.l.google.com:19302" }];
      // Asked of the receiver's decoder: stereo music quality, with loss recovery
      const OPUS_PARAMS = {
        stereo: 1,
        "sprop-stereo": 1,
        maxaveragebitrate: 128000,
        useinbandfec: 1,
      };
      const RECOVER_AFTER_MS = 2000; // let a short Wi-Fi blip heal before restarting ICE
      const CONNECT_TIMEOUT_MS = 8000;
      const MAX_ICE_RESTARTS = 2; // then start over with a fresh connection

      const randomId = () =>
        Date.now().toString(36) + Math.random().toString(36).slice(2);

      function selectSource(src) {
        selectedSource = src;
        document
          .getElementById("btn-system")
          .classList.toggle("active", src === "system");
        document
          .getElementById("btn-mic")
          .classList.toggle("active", src === "mic");
        document.getElementById("source-hint").textContent =
          src === "system"
            ? "System audio captures everything playing on your laptop."
            : "Microphone captures your laptop mic input.";
      }

      async function startSession() {
        document.getElementById("start-btn").disabled = true;
        document.getElementById("start-btn").textContent =
          "Requesting audio...";

        try {
          if (selectedSource === "system") {
            const display = await navigator.mediaDevices.getDisplayMedia({
              video: true,
              audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false,
              },
            });
            // Keep only audio tracks
            display.getVideoTracks().forEach((t) => t.stop());
            localStream = new MediaStream(display.getAudioTracks());
            if (localStream.getAudioTracks().length === 0) {
              alert(
                'No audio track found. Make sure to check "Share audio" in the screen picker.',
              );
              document.getElementById("start-btn").disabled = false;
              document.getElementById("start-btn").textContent =
                "Go Live";
              return;
            }
            localStream
              .getAudioTracks()
              .forEach((t) => (t.contentHint = "music"));
          } else {
            localStream = await navigator.mediaDevices.getUserMedia({
              audio: true,
              video: false,
            });
          }
        } catch (e) {
          alert("Could not get audio: " + e.message);
          document.getElementById("start-btn").disabled = false;
          document.getElementById("start-btn").textContent =
            "Go Live";
          return;
        }

        // Browser's "Stop sharing" bar ends the track
        localStream.getAudioTracks()[0].onended = () => stopSession();
        setupVisualiser(localStream);
        signal = connectSignal({
          onOpen: () => signal.send({ type: "start" }),
          onMessage: handleMessage,
          onDown: () => setStreamStatus("Reconnecting to server...", "err"),
        });
      }

      async function handleMessage(msg) {
        switch (msg.type) {
          case "started":
            showActiveSection();
            setStreamStatus("Streaming...", "ok");
            break;
          case "receiver-joined":
            await onReceiverJoined(msg);
            break;
          case "receiver-left":
            onReceiverLeft(msg.receiverId);
            break;
          case "answer": {
            const peer = peerFor(msg);
            if (peer?.pc.signalingState === "have-local-offer")
              await applyAnswer(peer.pc, msg.sdp);
            break;
          }
          case "ice-candidate": {
            const peer = peerFor(msg);
            if (peer && msg.candidate)
              await peer.pc.addIceCandidate(msg.candidate).catch(() => {});
            break;
          }
          case "replaced":
            teardown();
            setStreamStatus("Another sender page took over.", "err");
            break;
        }
      }

      // Ignore signalling meant for a connection we already replaced
      function peerFor({ receiverId, pcId }) {
        const peer = peers.get(receiverId);
        return peer?.pcId === pcId ? peer : null;
      }

      async function onReceiverJoined({ receiverId, pcId }) {
        const peer = peers.get(receiverId);
        if (peer) {
          peer.present = true;
          const state = peer.pc.connectionState;
          // Phone only lost the server link; the audio connection is fine
          const stillPlaying = peer.pcId === pcId && state === "connected";
          const negotiating =
            (state === "new" || state === "connecting") &&
            Date.now() - peer.createdAt < CONNECT_TIMEOUT_MS;
          if (stillPlaying || negotiating) return renderDevice(peer);
        }
        await createPeer(receiverId);
      }

      function onReceiverLeft(receiverId) {
        const peer = peers.get(receiverId);
        if (!peer) return;
        peer.present = false;
        // Audio flows peer-to-peer, so keep it until the connection itself fails
        if (peer.pc.connectionState === "connected") renderDevice(peer);
        else dropPeer(peer);
      }

      async function createPeer(receiverId) {
        closePeer(peers.get(receiverId));
        const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
        const peer = {
          receiverId,
          pc,
          pcId: randomId(),
          present: true,
          restarts: 0,
          createdAt: Date.now(),
          timer: null,
        };
        peers.set(receiverId, peer);

        localStream.getAudioTracks().forEach((track) => {
          const transceiver = pc.addTransceiver(track, {
            direction: "sendonly",
            streams: [localStream],
          });
          preferRed(transceiver);
        });

        pc.onicecandidate = ({ candidate }) => {
          if (candidate)
            signal.send({
              type: "ice-candidate",
              candidate,
              targetId: receiverId,
              pcId: peer.pcId,
            });
        };
        pc.onconnectionstatechange = () => onPeerState(peer);

        renderDevice(peer);
        await sendOffer(peer);
        pc.getSenders().forEach(prioritize);
      }

      async function sendOffer(peer, iceRestart = false) {
        const { pc } = peer;
        await pc.setLocalDescription(await pc.createOffer({ iceRestart }));
        signal.send({
          type: "offer",
          sdp: pc.localDescription,
          targetId: peer.receiverId,
          pcId: peer.pcId,
        });
        armWatchdog(peer, CONNECT_TIMEOUT_MS);
      }

      function armWatchdog(peer, ms) {
        clearTimeout(peer.timer);
        peer.timer = setTimeout(() => signal.run(() => recover(peer)), ms);
      }

      function onPeerState(peer) {
        if (peers.get(peer.receiverId) !== peer) return;
        switch (peer.pc.connectionState) {
          case "connected":
            clearTimeout(peer.timer);
            peer.restarts = 0;
            break;
          case "disconnected":
            armWatchdog(peer, RECOVER_AFTER_MS);
            break;
          case "failed":
            signal.run(() => recover(peer));
            break;
        }
        renderDevice(peer);
      }

      async function recover(peer) {
        const { pc } = peer;
        if (
          peers.get(peer.receiverId) !== peer ||
          pc.connectionState === "connected"
        )
          return;
        clearTimeout(peer.timer);
        // Phone is away: wait for it to rejoin rather than offering into the void
        if (!peer.present) {
          if (pc.connectionState !== "disconnected") dropPeer(peer);
          return;
        }
        if (!signal.isOpen) return armWatchdog(peer, CONNECT_TIMEOUT_MS);
        if (peer.restarts < MAX_ICE_RESTARTS && pc.signalingState === "stable") {
          // Keeps the current path playing while a new one is found
          peer.restarts++;
          await sendOffer(peer, true);
        } else {
          await createPeer(peer.receiverId);
        }
        renderDevice(peers.get(peer.receiverId));
      }

      function closePeer(peer) {
        if (!peer) return;
        clearTimeout(peer.timer);
        peer.pc.onconnectionstatechange = null;
        peer.pc.close();
      }

      function dropPeer(peer) {
        closePeer(peer);
        peers.delete(peer.receiverId);
        deviceEls.get(peer.receiverId)?.remove();
        deviceEls.delete(peer.receiverId);
        renderDeviceCount();
      }

      // Redundant audio (RED) resends each packet's predecessor, hiding the short
      // bursts of loss typical of Wi-Fi. Falls back to plain Opus if the phone lacks it.
      function preferRed(transceiver) {
        const codecs = RTCRtpReceiver.getCapabilities?.("audio")?.codecs;
        if (!codecs || !transceiver.setCodecPreferences) return;
        const isRed = (c) => c.mimeType.toLowerCase() === "audio/red";
        if (!codecs.some(isRed)) return;
        try {
          transceiver.setCodecPreferences([
            ...codecs.filter(isRed),
            ...codecs.filter((c) => !isRed(c)),
          ]);
        } catch {}
      }

      // Marks packets for Wi-Fi's voice queue (DSCP/WMM) where the OS allows it
      async function prioritize(sender) {
        try {
          const params = sender.getParameters();
          if (!params.encodings?.length) return;
          params.encodings.forEach((e) => {
            e.priority = "high";
            e.networkPriority = "high";
          });
          await sender.setParameters(params);
        } catch {}
      }

      async function applyAnswer(pc, answer) {
        try {
          await pc.setRemoteDescription({
            type: "answer",
            sdp: tuneOpus(answer.sdp),
          });
        } catch {
          await pc.setRemoteDescription(answer);
        }
      }

      function tuneOpus(sdp) {
        const pt = sdp.match(/a=rtpmap:(\d+) opus\/48000\/2/i)?.[1];
        if (!pt) return sdp;
        return sdp.replace(new RegExp(`a=fmtp:${pt} (.*)`), (_, current) => {
          const params = new Map(
            current.split(";").map((kv) => kv.trim().split("=")),
          );
          Object.entries(OPUS_PARAMS).forEach(([k, v]) => params.set(k, v));
          return (
            `a=fmtp:${pt} ` +
            [...params].map(([k, v]) => `${k}=${v}`).join(";")
          );
        });
      }

      function showActiveSection() {
        const receiverUrl = `${location.origin}/receiver.html`;
        document.getElementById("setup-section").style.display = "none";
        document.getElementById("active-section").style.display = "block";
        document.getElementById("receiver-url").textContent = receiverUrl;
        generateQR(receiverUrl);
      }

      function setStreamStatus(text, cls) {
        const el = document.getElementById("stream-status");
        el.textContent = text;
        el.className = "status-line " + cls;
      }

      function generateQR(receiverUrl) {
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(receiverUrl)}`;
        const qrDiv = document.getElementById("qrcode");
        qrDiv.innerHTML = `<img src="${qrUrl}" width="140" height="140" alt="QR Code">`;
        qrDiv.style.display = "block";
      }

      function renderDevice(peer) {
        if (!peer) return;
        let el = deviceEls.get(peer.receiverId);
        if (!el) {
          const list = document.getElementById("receivers-list");
          list.querySelector(".status-line")?.remove();
          el = document.createElement("div");
          el.className = "receiver-item";
          el.innerHTML = `<div class="dot"></div><span></span>`;
          el.dataset.name = `Device ${++deviceCount}`;
          list.appendChild(el);
          deviceEls.set(peer.receiverId, el);
        }
        const state = peer.pc.connectionState;
        const label =
          state === "connected"
            ? "connected"
            : state === "disconnected" || state === "failed"
              ? "reconnecting..."
              : "connecting...";
        el.classList.toggle("pending", state !== "connected");
        el.querySelector("span").textContent = `${el.dataset.name} ${label}`;
        renderDeviceCount();
      }

      function renderDeviceCount() {
        document.getElementById("rx-count").textContent = peers.size;
        const list = document.getElementById("receivers-list");
        if (!peers.size && !list.querySelector(".status-line"))
          list.innerHTML =
            '<p class="status-line">Waiting for phones to connect...</p>';
      }

      function setupVisualiser(stream) {
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        const src = audioCtx.createMediaStreamSource(stream);
        src.connect(analyser);

        const viz = document.getElementById("viz");
        viz.innerHTML = "";
        const bars = Array.from({ length: 20 }, () => {
          const b = document.createElement("div");
          b.className = "viz-bar";
          b.style.height = "3px";
          viz.appendChild(b);
          return b;
        });

        const data = new Uint8Array(analyser.frequencyBinCount);
        function draw() {
          animId = requestAnimationFrame(draw);
          analyser.getByteFrequencyData(data);
          bars.forEach((b, i) => {
            const v = (data[i] || 0) / 255;
            b.style.height = 3 + v * 37 + "px";
            b.style.opacity = 0.4 + v * 0.6;
          });
        }
        draw();
      }

      function teardown() {
        if (animId) cancelAnimationFrame(animId);
        if (audioCtx) audioCtx.close();
        if (localStream) localStream.getTracks().forEach((t) => t.stop());
        peers.forEach(closePeer);
        peers.clear();
        signal?.close();
      }

      function stopSession() {
        // Explicit stop lets phones drop the connection now instead of waiting for it to time out
        signal?.send({ type: "stop" });
        teardown();
        location.reload();
      }

      window.addEventListener("pagehide", () => signal?.send({ type: "stop" }));
    </script>
  </body>
</html>
